[package]
name = "torlnk-rs"
version = "0.1.0"
edition = "2021"
description = "A sleek, zero-setup torrent finder and downloader that lives right in your terminal."
license = "MIT"
authors = ["bairon"]
repository = "https://github.com/baairon/torlnk-rs"
homepage = "https://torlink.bairon.dev"

[[bin]]
name = "torlnk"
path = "src/main.rs"

[lib]
name = "torlnk"
path = "src/lib.rs"

[dependencies]
# Torrent engine
librqbit = "8"

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"

# HTTP client
reqwest = { version = "0.12", features = ["json", "gzip", "brotli"] }

# Web framework (headless modes)
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Utilities
dirs = "6"
scraper = "0.22"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"
notify = "8"
which = "7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
